name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x, not 8.0.x: benchmarks/AnvilMap.Benchmarks multi-targets up to net10.0
          # (a TFM the 8.0.x SDK doesn't recognize at all - a newer SDK can still build every
          # older TFM in this solution (netstandard2.0, net6.0, net8.0) without needing those
          # SDKs installed too, since TFM support comes from NuGet ref packs, not SDK version).
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AnvilMap.sln

      - name: Verify code style
        run: dotnet format style AnvilMap.sln --verify-no-changes --severity warn

      - name: Build
        run: dotnet build AnvilMap.sln -c Release --no-restore

      - name: Test
        run: dotnet test AnvilMap.sln -c Release --no-build

      - name: Pack
        run: dotnet pack AnvilMap.sln -c Release --no-build -o ./nupkg-out

      # A successful `pack` alone doesn't prove the package actually works for a consumer - two
      # real bugs (an auto-applied consumer-side PrivateAssets/IncludeAssets restriction that hid
      # the Abstractions types entirely, and a System.Collections.Immutable version pinned far
      # above what Roslyn 4.8.0 itself depends on, breaking generator load in an older host) were
      # only caught by actually installing the packed .nupkg into a separate consumer project and
      # building/running it. smoke-test/ConsumerSmokeTest is a real,
      # tracked, minimal console project kept outside AnvilMap.sln for exactly this: its
      # nuget.config points at ../../nupkg-out (this step's output), so restoring it here
      # reproduces the same check on every push/PR. Multi-targeted net8.0;net10.0 - run once per
      # TFM, since dotnet run can't infer one on a multi-targeted project.
      - name: Smoke-test packages from a separate consumer project
        working-directory: smoke-test/ConsumerSmokeTest
        run: |
          rm -rf bin obj
          dotnet nuget locals all --clear
          dotnet run -c Release -f net8.0
          dotnet run -c Release -f net10.0
